<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Credit card copy test</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f8; color: #18323c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 36px 20px; }
    h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.2; letter-spacing: -.02em; }
    .instruction { margin: 0 0 24px; font-size: 17px; }
    #sample { margin: 0; padding: 24px 20px; border: 2px solid #9ab9be; border-radius: 14px; background: #fff; font-size: 20px; line-height: 1.8; white-space: pre-line; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
    footer { margin-top: 28px; font-size: 14px; color: #526974; }
  </style>
</head>
<body>
  <main>
    <h1>Credit card copy test</h1>
    <p class="instruction">Long-press the sample. Select all lines below, then use Copy in the iOS menu.</p>
    <p id="sample">Synthetic test data. No real payment card.
Cardholder: Preview Test User
Credit card number: 4111 1111 1111 1111
Expiration date: 12/28
CVV: 123
Billing ZIP code: 10001
</p>
    <footer>Synthetic test data</footer>
  </main>
</body>
</html>
